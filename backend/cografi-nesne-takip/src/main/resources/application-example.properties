# Bu dosyayı application.properties'e yapıştırıp kendi yerel değerlerinizi girin.

spring.application.name=cografi-nesne-takip
spring.datasource.url=EnterDatasourceUrlHere
spring.datasource.username=EnterDatabaseUsernameHere
spring.datasource.password=EnterDatabasePasswordHere

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.servlet.multipart.max-file-size=10MB


app.photo-storage.base-path=${PHOTO_BASE_PATH}
app.bootstrap-admin.email=bootstrapadminemail
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.flyway.out-of-order=true